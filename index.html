<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>(주)아트리움제이 | 본질과 체계</title>
  <style>
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");
    :root { --bg:#0a0908; --ink:#f4efe6; --soft:#cfc6b6; --mute:#6d6458; --gold:#c9a56a; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; background:var(--bg); color:var(--ink); font-family:Pretendard,"Apple SD Gothic Neo",sans-serif; overflow:hidden; }
    #loader {
      position:fixed; inset:0; z-index:50; background:var(--bg);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      transition:opacity .7s ease;
    }
    #loader.hide { opacity:0; pointer-events:none; }
    #pct { font-size:clamp(48px,8vw,96px); font-weight:700; letter-spacing:-.04em; }
    #bar { width:120px; height:1px; background:#2a241c; margin-top:18px; position:relative; overflow:hidden; }
    #bar > i { display:block; height:100%; width:0; background:var(--gold); }
    .menu { position:fixed; top:22px; right:28px; z-index:20; font-size:12px; letter-spacing:.32em; color:#cfc6b6; }
    .vline { position:fixed; top:0; bottom:0; left:50%; width:1px; background:rgba(201,165,106,.12); transform:translateX(-.5px); pointer-events:none; z-index:0; }
    .slides { height:100%; overflow-y:scroll; scroll-snap-type:y mandatory; scroll-behavior:smooth; }
    section { min-height:100%; scroll-snap-align:start; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:8vh 6vw 14vh; position:relative; }
    .kicker { letter-spacing:.42em; font-size:11px; color:var(--mute); margin-bottom:28px; }
    h1 { font-weight:700; font-size:clamp(28px,5.8vw,70px); line-height:1.18; letter-spacing:-.03em; }
    h1 .lw { display:block; overflow:hidden; }
    h1 .li { display:block; }
    .subbox { margin-top:32px; min-height:3.4em; color:var(--soft); font-size:clamp(14px,1.55vw,18px); line-height:1.75; font-weight:300; position:relative; }
    .subbox span { display:block; }
    .swipe { position:absolute; bottom:28px; left:0; right:0; font-size:10px; letter-spacing:.4em; color:var(--mute); }
    .dot { display:block; margin-top:8px; }
    .kicker, .subbox, .swipe, h1 .li { opacity:0; transform:translateY(28px); }
    section.on .kicker { animation:rise .9s .1s cubic-bezier(.22,1,.36,1) forwards; }
    section.on h1 .lw:nth-child(1) .li { animation:rise 1s .22s cubic-bezier(.22,1,.36,1) forwards; }
    section.on h1 .lw:nth-child(2) .li { animation:rise 1s .38s cubic-bezier(.22,1,.36,1) forwards; }
    section.on .subbox { animation:rise .9s .62s cubic-bezier(.22,1,.36,1) forwards; }
    section.on .swipe { animation:rise .8s .9s ease forwards, pulse 2.4s 1.6s ease-in-out infinite; }
    @keyframes rise { from { opacity:0; transform:translateY(32px);} to { opacity:1; transform:translateY(0);} }
    @keyframes pulse { 0%,100% { opacity:.7;} 50% { opacity:.25;} }
    .fade { animation:xfade .55s ease; }
    @keyframes xfade { from { opacity:0; transform:translateY(10px);} to { opacity:1; transform:translateY(0);} }
    a { color:var(--gold); text-decoration:none; }
    p.role { margin-top:18px; letter-spacing:.28em; font-size:12px; color:var(--gold); }
    .endlogo { width:min(220px,46vw); margin-top:48px; display:block; opacity:0; transform:translateY(16px); }
    section.on .endlogo { animation:rise .9s .85s cubic-bezier(.22,1,.36,1) forwards; }
    section.on p.role { animation:rise .8s .5s cubic-bezier(.22,1,.36,1) forwards; }
    p.role { opacity:0; transform:translateY(20px); }
  </style>
</head>

  <script>
    const loader = document.getElementById("loader");
    const pct = document.getElementById("pct");
    const bar = document.querySelector("#bar > i");
    let n = 0;
    const tick = () => {
      n += Math.max(1, Math.round((100 - n) * 0.08));
      if (n > 100) n = 100;
      pct.textContent = n + "%";
      bar.style.width = n + "%";
      if (n < 100) requestAnimationFrame(tick);
      else setTimeout(() => {
        loader.classList.add("hide");
        document.querySelector("section").classList.add("on");
        setTimeout(() => loader.remove(), 800);
      }, 280);
    };
    requestAnimationFrame(tick);

    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          e.target.classList.remove("on");
          void e.target.offsetWidth;
          e.target.classList.add("on");
        }
      });
    }, { threshold: 0.55 });
    document.querySelectorAll("section").forEach((s) => io.observe(s));

    document.querySelectorAll(".subbox[data-rot]").forEach((box) => {
      const list = JSON.parse(box.getAttribute("data-rot"));
      let i = 0;
      setInterval(() => {
        i = (i + 1) % list.length;
        const span = box.querySelector("span");
        span.classList.remove("fade");
        void span.offsetWidth;
        span.textContent = list[i];
        span.classList.add("fade");
      }, 2800);
    });
  </script>
